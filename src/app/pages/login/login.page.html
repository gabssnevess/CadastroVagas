<ion-content>
  <section>
    <div>
      <ion-title>Bem-Vindo!</ion-title>
      <ion-input name="email" placeholder="Email" fill="outline" [(ngModel)]="email" type="email"></ion-input>
      <ion-input name="senha" placeholder="Senha" fill="outline" [(ngModel)]="senha" type="password"></ion-input>
      <ion-button (click)="login()">login</ion-button>
    </div>
  </section>
</ion-content>
